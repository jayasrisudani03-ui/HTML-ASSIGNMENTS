<!DOCTYPE html>
<html>
<head>
  <title>Running Animals</title>
  <style>
    body {
      background-image: url('garden image.webp');
      background-size: cover;
      margin: 0;
    }
    marquee img {
      height: 100px;
    }
  </style>
</head>
<body>

  <marquee direction="right" behavior="scroll" scrollamount="15" loop="-1">
    <img src="elephant image.jpg" alt="elephant">
  </marquee>

  <marquee direction="right" behavior="scroll" scrollamount="20" loop="-1">
    <img src="dog.jpg" alt="dog">
  </marquee>

  <marquee direction="right" behavior="scroll" scrollamount="25" loop="-1">
    <img src="cat.jpg" alt="cat">
  </marquee>

  <marquee direction="right" behavior="scroll" scrollamount="30" loop="-1">
    <img src="rat.pjg" alt="rat">
  </marquee>

</body>
</html>
